<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SME Recruitment Assistant</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17332f;background:#f3f6f3}body{max-width:1100px;margin:40px auto;padding:0 20px}h1{font-size:32px;margin-bottom:8px}h2{font-size:21px}p{line-height:1.6}.muted{color:#536b65;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;padding:24px;border:1px solid #d8e3dc;border-radius:14px;margin:18px 0}textarea,select,input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #a5b9ae;border-radius:7px;font:inherit;margin:8px 0}textarea{min-height:160px}button{background:#146454;color:white;border:0;border-radius:7px;padding:11px 17px;cursor:pointer;margin:6px 8px 6px 0}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#e3eee8;color:#17332f}.tag{background:#e7eee8;padding:5px 9px;border-radius:6px;font-size:13px}table{width:100%;border-collapse:collapse;margin:16px 0}td,th{text-align:left;padding:10px;border-bottom:1px solid #e5eae5;overflow-wrap:anywhere}#error{color:#a12626;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}label{display:block;font-weight:600}.answer{min-height:60px}.score{font-size:26px;font-weight:700}.notice{border-left:4px solid #c5a653;padding-left:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}body{margin:20px auto}.card{padding:16px}}
</style>
<body>
<span class="tag">SINGAPORE SME · LOCAL DEMO</span>
<h1>Recruitment Assistant</h1>
<p>从招聘需求到证据整理、补充信息与人工决策。</p>
<p class="muted notice">本地演示 · JD 使用有限英文规则，简历支持规则或已配置的模型 · 不发送邮件。分数仅代表技能证据覆盖率，不代表录用概率。经验要求单独评估；薪资、学历和工作资格由招聘者审核。</p>
<div class="card"><h2>1. 输入职位与简历</h2>
<button id="demo" class="secondary">载入示例</button>
<div class="grid"><div><label for="jd">Job description</label><textarea id="jd" placeholder="Accounts Executive&#10;Required: Excel, Xero&#10;GST preferred"></textarea></div>
<div><label for="resumes">Resumes（多份之间用单独一行 --- 分隔）</label><textarea id="resumes"></textarea></div></div>
<button id="start">解析 JD，创建评估</button></div>
<p id="error" role="alert"></p><div id="run"></div>
<script>
let state;let busy=false;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
async function guard(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);document.querySelector('#error').textContent='';try{await fn()}catch(e){document.querySelector('#error').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function button(label,fn){const b=el('button',label);b.onclick=()=>guard(fn);return b}
async function update(op,payload={}){state=await api('/api/runs/'+state.id+'/'+op,payload);render()}
document.querySelector('#demo').onclick=()=>guard(async()=>{const d=await api('/api/demo');document.querySelector('#jd').value=d.jd;document.querySelector('#resumes').value=d.resumes.join('\n---\n')});
document.querySelector('#start').onclick=()=>guard(async()=>{state=await api('/api/runs',{jd:document.querySelector('#jd').value,resumes:document.querySelector('#resumes').value.split(/^\s*---\s*$/m).map(s=>s.trim()).filter(Boolean)});localStorage.setItem('recruitmentRun',state.id);render()});
function render(){const root=document.querySelector('#run');root.replaceChildren();const job=el('section',undefined,'card');job.append(el('h2','2. 确认招聘标准'),el('p',state.job.role));job.append(el('p','已识别标准：'+state.job.criteria.map(c=>(c.description||c.label)+(c.scored===false?'（单独评估，不计入技能分）':c.required?'（必需，权重 2）':'（优先，权重 1）')).join('、')));if(state.job.human_review_items)job.append(el('p','人工核实：'+state.job.human_review_items.map(i=>i.label).join('、'),'muted'));job.append(el('p','请在筛选前确认标准。如有遗漏或分类错误，请修改上方 JD 后重新创建评估。姓名、年龄、性别、国籍、照片不作为评分维度。','muted'));if(!state.criteria_confirmed)job.append(button('确认以上标准，开始评估',()=>update('confirm')));root.append(job);if(!state.criteria_confirmed)return;
for(const c of [...state.candidates].sort((a,b)=>(a.evaluation.rank??999)-(b.evaluation.rank??999))){const box=el('section',undefined,'card');box.append(el('h2',c.id),el('span',({SHORTLIST:'建议入围 · 待人工审核',REQUEST_INFO:'待补充信息',LOW_MATCH:'必需项不满足 · 待人工审核',HUMAN_REVIEW:'需人工审核',COMPLETE:'已记录人工决定'})[c.action]||c.action,'tag'));box.append(el('p',(c.evaluation.documented_score??c.evaluation.score??'—')+' / 100','score'),el('p','已有证据覆盖率 · 可能覆盖率 '+(c.evaluation.possible_score??'—')+'% · 证据完整度 '+(c.evaluation.evidence_completeness??'—')+'%','muted'),el('p','排名 '+(c.evaluation.rank??'—')+' · '+(c.evaluation.rank_status==='provisional'?'暂定，补充信息后可能变化':'当前证据排序，并非录用结果')+' · '+c.evaluation.missing_information.length+' 项待澄清','muted'),el('p','评估方式：'+c.evaluation.parser,'muted'));
const table=el('table');const header=el('tr');['要求','证据状态','判断理由','原文 / 补充回答'].forEach(t=>header.append(el('th',t)));table.append(header);for(const d of c.evaluation.details){const tr=el('tr');[d.description||d.label,d.status,d.reason||'—',(d.evidence_refs||[]).map(r=>(r.source==='followup'?'补充回答':'简历第 '+r.line+' 行')+'：'+r.text).join('\n')||d.evidence.join('\n')||'简历未提及，不能据此认定不具备'].forEach(t=>tr.append(el('td',t)));table.append(tr)}box.append(table);
if(['REQUEST_INFO','REQUEST_INFORMATION'].includes(c.action)){box.append(el('h3','待审批的追问草稿'),el('p','演示中由招聘者录入候选人回答并确认其证据状态。最多追问两轮，之后交人工审核。','muted'));const inputs=[];for(const q of c.evaluation.questions){const label=el('label',q.question);const text=el('textarea');text.className='answer';text.setAttribute('aria-label',q.question);text.placeholder='填写候选人的实际回答；留空则本次不提交';const select=el('select');select.setAttribute('aria-label',q.criterion_id+' evidence status');[['unknown','仍不明确'],['evidenced','回答提供了相关证据'],['not_met','回答明确表示不具备']].forEach(([v,t])=>{const o=el('option',t);o.value=v;select.append(o)});box.append(label,text,select);inputs.push({id:q.criterion_id,text,select})}box.append(button('记录回答并重新评估',async()=>{const answers={};inputs.forEach(i=>{if(i.text.value.trim())answers[i.id]={status:i.select.value,evidence:i.text.value.trim()}});await update('followup',{candidate_id:c.id,answers})}))}
if(!c.decision&&['SHORTLIST','LOW_MATCH','HUMAN_REVIEW'].includes(c.action)){box.append(el('h3','Human-in-the-loop'));const choice=el('select');choice.setAttribute('aria-label',c.id+' human decision');[['hold','暂缓 / 继续人工审核'],['shortlist','人工批准入围'],['decline','人工决定不推进']].forEach(([v,t])=>{const o=el('option',t);o.value=v;choice.append(o)});const reason=el('input');reason.placeholder='必填：人工决策理由';reason.setAttribute('aria-label','人工决策理由');box.append(choice,reason,button('保存人工决策',()=>update('review',{candidate_id:c.id,decision:choice.value,reason:reason.value})))}else if(c.decision)box.append(el('p','人工决策：'+c.decision.decision+' — '+c.decision.reason));root.append(box)}
const log=el('section',undefined,'card');log.append(el('h2','Agent 行动记录'),el('pre',state.events.map(e=>e.step+'. '+e.action+' — '+(e.detail||[e.candidate_id,e.reason].filter(Boolean).join(': '))).join('\n')));root.append(log)}
const saved=localStorage.getItem('recruitmentRun');if(saved)guard(async()=>{state=await api('/api/runs/'+saved);render()});
</script></body></html>
